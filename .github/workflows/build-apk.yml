name: Build Earbridge APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (Capacitor CLI)
        run: npm install

      # Baked into receiver.html so the APK can reach the hosted signalling
      # server. Inside the Capacitor WebView location.origin is always
      # https://localhost, so without this the app cannot connect to anything
      # but a manually-entered server. Leave unset for a LAN-only APK.
      - name: Build web client
        working-directory: client
        env:
          EARBRIDGE_SERVER: ${{ vars.EARBRIDGE_SERVER }}
        run: |
          npm ci || npm install
          npm run build

      - name: Sync Capacitor assets
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: earbridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
