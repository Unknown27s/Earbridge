<meta name="earbridge-server" content=""><script>window.__EB_BASE=function(){var s="";try{s=localStorage.getItem("earbridge_server")||""}catch(e){}if(!s){try{var m=document.querySelector('meta[name="earbridge-server"]');s=m?(m.content||"").trim():""}catch(e){}}return s||location.origin;};window.__EB_ICE=null;fetch(window.__EB_BASE()+"/ice-servers",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.iceServers)window.__EB_ICE=j.iceServers}).catch(function(){});</script></head>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const fetchT=(url,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
    return fetch(url,{signal:c.signal,cache:"no-store"}).finally(()=>clearTimeout(t));};
  const netDetail=()=>navigator.onLine===false
    ?"This phone has no network. Turn on WiFi or mobile data."
    :"No response from "+base()+". Check the PC server is running and that this phone is on the SAME WiFi as the PC.";
  const getSaved=()=>{try{return localStorage.getItem("earbridge_server")||""}catch(e){return ""}};
  const norm=(u)=>{u=(u||"").trim().replace(/\/+$/,"");if(!u)return "";return /^https?:\/\//i.test(u)?u:"http://"+u};
  const base=()=>window.__EB_BASE?window.__EB_BASE():(getSaved()||location.origin);
  let peerId="", peer=null, micStream=null, micCall=null, micMode=0, volume=1;
  let uiState="idle", lastSeenPeer="", pollTimer=null, pollBusy=false, backoff=2000;
  try{const v=Number(localStorage.getItem("earbridge_volume"));if(isFinite(v))volume=Math.min(Math.max(v,0),1);}catch(e){}

  function peerOpts(){const u=new URL(base());return{host:u.hostname,port:Number(u.port)||(u.protocol==="https:"?443:80),path:"/peerjs",secure:u.protocol==="https:",config:window.__EB_ICE&&window.__EB_ICE.length?{iceServers:window.__EB_ICE}:undefined};}
  function wsUrl(){const u=new URL(base());const p=u.protocol==="https:"?"wss":"ws";const port=Number(u.port)||(u.protocol==="https:"?443:80);return p+"://"+u.host+"/control";}

  function setUI(state,sub){
    uiState=state;
    const map={idle:["Ready to connect","Open the sender on your PC and press Start Streaming"],
      connecting:["Connecting…","Talking to your PC"],live:["Receiving to Bluetooth","Direct audio stream routed via phone bridge"],
      reconnecting:["Reconnecting…","Lost the stream — retrying"],
      offline:["No network","This phone has no network. Turn on WiFi or mobile data."],
      unreachable:["Can't reach the PC",netDetail()],
      noPC:["Waiting for PC…","Server reachable, but the PC hasn't started streaming yet. Open sender.html on the PC and press Start Streaming."],
      error:["Connection error","Check the PC and try again"]};
    $("status-headline").textContent=map[state][0];
    document.querySelector("main p").textContent=sub||map[state][1];
    $("orb-live-badge").style.display=state==="live"?"flex":"none";
    const btn=$("connect-btn");
    const lbl=btn.querySelector("#connect-label");
    if(state==="live"){lbl.textContent="Stop PC Audio";btn.classList.remove("bg-live");btn.classList.add("bg-danger");}
    else if(state==="offline"){lbl.textContent="No network";btn.classList.add("bg-live");btn.classList.remove("bg-danger");}
    else if(state==="unreachable"||state==="error"){lbl.textContent="Retry";btn.classList.add("bg-live");btn.classList.remove("bg-danger");}
    else{lbl.textContent=peerId?"Connect":"Waiting for PC…";btn.classList.add("bg-live");btn.classList.remove("bg-danger");}
    btn.disabled=(!peerId||state==="offline")&&state!=="live"&&state!=="unreachable"&&state!=="error";
  }

  async function askBase(){
    const v=prompt("Which PC server?",getSaved()||base()||"http://192.168.1.20:3000");
    if(v&&norm(v)){try{localStorage.setItem("earbridge_server",norm(v));}catch(e){}return true;}
    return false;
  }

  async function poll(){
    if(pollBusy)return;
    pollBusy=true;
    try{
      if(navigator.onLine===false){setUI("offline");return;}
      let r;
      try{r=await fetchT(base()+"/sender-id",3000);}
      catch(e){backoff=Math.min(backoff*2,30000);setUI("unreachable",netDetail());return;}
      const j=await r.json();
      backoff=2000;
      if(j.id&&j.id!==lastSeenPeer){
        const pcRestarted=!!lastSeenPeer&&j.id!==lastSeenPeer;
        peerId=j.id;lastSeenPeer=j.id;
        $("peer-id-text").textContent="PEER ID: "+peerId.slice(0,11);
        // The PC reloads its sender page and gets a brand new PeerJS id. Reconnect
        // instead of sitting on a dead one forever.
        if(pcRestarted&&(uiState==="live"||uiState==="connecting")){try{peer&&peer.destroy();}catch(e){}peer=null;}
        if(uiState!=="live")setUI("idle");
      } else if(!j.id&&uiState!=="live"){
        setUI("noPC");
      }
    }catch(e){setUI("unreachable",netDetail());}
    finally{pollBusy=false;}
  }

  function startPolling(){
    clearTimeout(pollTimer);
    const tick=async()=>{await poll();pollTimer=setTimeout(tick,backoff);};
    tick();
  }

  function connect(){
    if(!peerId)return;
    setUI("connecting");
    peer=new Peer(undefined,peerOpts());
    peer.on("open",()=>{const c=peer.connect(peerId);c.on("open",()=>c.send("hello"));});
    peer.on("call",(call)=>{
      call.answer();
      call.on("stream",(stream)=>{
        const a=$("rx-audio");a.srcObject=stream;a.volume=volume;a.play().catch(()=>{});
        try{const C=new (window.AudioContext||window.webkitAudioContext)();C.resume();}catch(e){}
        try{if("wakeLock" in navigator)navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
        try{if("mediaSession" in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:"PC Audio",artist:"Earbridge"});}catch(e){}
        try{const rx=call.peerConnection.getReceivers()[0];if(rx){rx.playoutDelayHint=0;if("jitterBufferTarget" in rx)rx.jitterBufferTarget=0;}}catch(e){}
        setUI("live");
        setInterval(async()=>{
          try{const rep=await call.peerConnection.getStats();let jit=null,br=null,drop=null,rtt=null,bytes=0;
            rep.forEach(x=>{if(x.type==="inbound-rtp"&&x.kind==="audio"){if(x.jitter!=null)jit=x.jitter*1000;bytes+=x.bytesReceived||0;if(x.packetsLost!=null)drop=x.packetsLost;}
              if(x.type==="candidate-pair"&&x.nominated&&x.currentRoundTripTime!=null)rtt=x.currentRoundTripTime*1000;});
            if(jit!=null)$("t-buffer").textContent=Math.round(jit)+" ms";
            if(drop!=null)$("t-drops").textContent=drop+" pkts";
            if(rtt!=null)$("latency-pill").textContent=Math.round(rtt)+"ms";
            if(window._rxBytes!=null&&bytes>window._rxBytes)$("t-bitrate").textContent=Math.round((bytes-window._rxBytes)*8/3000)+" kbps";
            window._rxBytes=bytes;}catch(e){}
        },3000);
      });
    });
    peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}setUI("reconnecting");});
    peer.on("error",(e)=>{
      const t=(e&&e.type)||"";
      const sub=(t==="peer-unavailable"||t==="unavailable-id")
        ?"The PC closed its stream. It probably reloaded the sender page — waiting for it to come back."
        :t==="network"||t==="socket-error"
          ?"Could not reach the signalling server at "+base()+"."
          :"Signalling failed ("+(t||"unknown")+").";
      if(uiState!=="live")setUI("error",sub);
    });
  }

  async function toggleMic(){
    const b=$("mic-btn");
    if(micMode===0){
      try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});}catch(e){b.textContent="🎤 Mic blocked";setTimeout(function(){if(micMode===0)b.textContent="🎤 Mic: OFF";},2500);return;}
      if(!peer){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;return;}
      micCall=peer.call(peerId,micStream);micMode=1;b.textContent="🎤 Mic: ON";
    }else if(micMode===1){
      micStream.getAudioTracks().forEach(t=>t.enabled=false);micMode=2;b.textContent="🎤 Mic: MUTED";
    }else{
      try{micCall&&micCall.close();}catch(e){}micStream&&micStream.getTracks().forEach(t=>t.stop());
      micStream=null;micMode=0;b.textContent="🎤 Mic: OFF";
    }
  }

  function stopAll(){
    try{const w=new WebSocket(wsUrl());w.onopen=()=>w.send(JSON.stringify({role:"receiver",cmd:"stop"}));}catch(e){}
    try{micCall&&micCall.close();}catch(e){}micStream&&micStream.getTracks().forEach(t=>t.stop());
    micStream=null;micMode=0;$("mic-btn").textContent="🎤 Mic: OFF";
    try{peer&&peer.destroy();}catch(e){}peer=null;
    $("t-buffer").textContent="—";$("t-bitrate").textContent="—";$("t-drops").textContent="—";$("latency-pill").textContent="—";
    setUI("idle");
  }

  let qrScanner=null;
  async function closeScanner(){try{if(qrScanner){await qrScanner.stop();qrScanner.clear();}}catch(e){}qrScanner=null;$("scan-overlay").style.display="none";}
  async function openScanner(){
    $("scan-overlay").style.display="flex";
    try{
      qrScanner=new Html5Qrcode("qr-reader");
      await qrScanner.start({facingMode:"environment"},{fps:10,qrbox:250},
        (text)=>{try{const u=new URL(text);const id=u.searchParams.get("id");if(id){peerId=id;lastSeenPeer=id;$("peer-id-text").textContent="PEER ID: "+id.slice(0,11);closeScanner();setTimeout(()=>$("connect-btn").click(),400);}else{setUI("error","That QR code is not an Earbridge code.");}}catch(e){setUI("error","Could not read that QR code.");}},
        ()=>{});
    }catch(e){$("scan-overlay").style.display="none";}
  }
  $("scan-btn").addEventListener("click",openScanner);
  $("scan-close").addEventListener("click",closeScanner);
  $("connect-btn").addEventListener("click",()=>{
    if(uiState==="live"){stopAll();return;}
    if(uiState==="unreachable"||uiState==="error"||uiState==="offline"){
      // Retry is the manual escape hatch: re-probe, and let the user correct the
      // address when they are pointed at the wrong server.
      (async()=>{
        if(uiState!=="offline"&&!await (async()=>{try{await fetchT(base()+"/sender-id",3000);return true;}catch(e){return false;}})()){
          if(!(await askBase()))return;
        }
        backoff=2000;await poll();startPolling();
      })();
      return;
    }
    connect();
  });
  $("mic-btn").addEventListener("click",toggleMic);
  $("vol-slider").addEventListener("input",(e)=>{volume=Number(e.target.value)/100;const a=$("rx-audio");if(a)a.volume=volume;try{localStorage.setItem("earbridge_volume",String(volume));}catch(e2){}});
  $("vol-slider").value=Math.round(volume*100);
  $("settings-btn").addEventListener("click",()=>{const v=prompt("PC server URL",getSaved()||base());if(v&&norm(v)){try{localStorage.setItem("earbridge_server",norm(v));}catch(e){}location.reload();}});
  $("output-chip").addEventListener("click",async()=>{
    try{
      const devs=await navigator.mediaDevices.enumerateDevices();
      const outs=devs.filter(d=>d.kind==="audiooutput");
      const a=$("rx-audio");
      if(a&&a.setSinkId&&outs.length>1){
        const cur=outs.findIndex(d=>d.deviceId===(a.sinkId||""));
        const nxt=outs[(cur+1)%outs.length];
        await a.setSinkId(nxt.deviceId);
        $("output-name").textContent=nxt.label||"Output "+((cur+1)%outs.length+1);
      }
    }catch(e){}
  });

  (async()=>{
    try{const Cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
      if(Cap&&Cap.addListener)await Cap.addListener("appUrlOpen",(ev)=>{try{const id=new URL(ev.url).searchParams.get("id");if(id){peerId=id;lastSeenPeer=id;$("peer-id-text").textContent="PEER ID: "+id.slice(0,11);setTimeout(()=>$("connect-btn").click(),500);}}catch(e){}});
    }catch(e){}
    const q=new URLSearchParams(location.search).get("id");
    if(q){peerId=q;lastSeenPeer=q;$("peer-id-text").textContent="PEER ID: "+q.slice(0,11);setUI("idle");setTimeout(()=>$("connect-btn").click(),600);return;}
    try{$("pc-label").textContent="PC "+new URL(base()).hostname;}catch(e){}
    if(navigator.onLine===false)setUI("offline");
    else{
      try{await fetchT(base()+"/sender-id",3000);setUI("noPC");}
      catch(e){setUI("unreachable",netDetail());}
    }
    startPolling();
    addEventListener("online",()=>{backoff=2000;startPolling();});
    addEventListener("offline",()=>{if(uiState!=="live")setUI("offline");});
  })();
})();
</script>
</body></html>
